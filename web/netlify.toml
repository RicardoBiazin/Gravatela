# Gravatela (web) no Netlify: site estático + Edge Function do portão anti-robô.
# A gravação acontece inteira no navegador; nenhum vídeo passa pelo servidor.
#
# Variáveis no painel do Netlify:
#   PORTAO_SEGREDO        (obrigatória; sem ela o site responde 500 de propósito)
#   REDIRECIONAR_DOMINIO  ("1" depois que gravatela.biazin.com.br estiver no ar:
#                          o gravatela-212.netlify.app passa a redirecionar com 301)

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[[edge_functions]]
  function = "portao"
  path = "/*"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; connect-src 'self'; img-src 'self' data: blob:; media-src 'self' blob: mediastream:; style-src 'self'; font-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "display-capture=(self), microphone=(self), camera=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Strict-Transport-Security = "max-age=31536000"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
